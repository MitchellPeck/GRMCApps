<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRMC Narthex TV</title>
<link rel="stylesheet" href="/player.css">
</head>
<body>
<!-- Everything the TV shows lives inside #stage so one transform can rotate
     the whole picture for a portrait screen. -->
<div id="stage">
  <div class="layer" id="layer-a"></div>
  <div class="layer" id="layer-b"></div>

  <!-- Only the fallback now: the real idle screen is rendered by the server
       and arrives as an ordinary frame, so the Blackmagic path shows it too.
       This is what is left if the render failed or the network is down. -->
  <div id="idle" class="overlay-center" hidden>
    <div class="idle-mark" id="idle-mark">G</div>
    <h2 id="idle-headline"></h2>
    <p id="idle-text"></p>
  </div>

  <div id="clock" class="chrome" hidden>
    <div id="clock-time"></div>
    <div id="clock-date"></div>
  </div>

  <div id="footer" class="chrome" hidden></div>

  <div id="status" class="chrome" hidden></div>

  <!-- Outside opening hours. Last in the stacking order on purpose: whatever
       goes wrong elsewhere, this still covers it. -->
  <div id="blackout" hidden></div>

  <!-- Above everything, including the blackout: an emergency message must be
       visible even outside the narthex's opening hours. -->
  <div id="takeover" class="overlay-center" hidden>
    <h1 id="takeover-headline"></h1>
    <p id="takeover-body"></p>
  </div>
</div>
<script src="/player.js"></script>
</body>
</html>
