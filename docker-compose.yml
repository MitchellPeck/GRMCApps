services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    # Static config is provided entirely as CLI args (not a configfile) so Compose
    # interpolates ${ACME_EMAIL}. Traefik does NOT expand env vars inside a YAML
    # configfile, and it ignores CLI static-config args when --configfile is set —
    # so the resolver email must come in via args like this.
    command:
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=grmcapps_hubnet"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--log.level=INFO"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.dnschallenge=true"
      - "--certificatesresolvers.le.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.le.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
    environment:
      CF_DNS_API_TOKEN: "${CF_DNS_API_TOKEN}"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"   # Traefik dashboard (local only)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - letsencrypt:/letsencrypt
    networks: [hubnet]

  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [hubnet]

  # One-shot: ensures every app's role + database exists, then exits. Runs on
  # each `up` (not just first Postgres init), so adding an app's *_DB_* vars +
  # a line in db/init/01-databases.sh provisions it automatically — no manual
  # psql. Idempotent; connects over the network as the superuser (PGHOST/
  # PGPASSWORD). Apps gate on this via `service_completed_successfully`.
  db-init:
    image: postgres:16
    env_file: .env
    environment:
      PGHOST: postgres
      PGPASSWORD: "${POSTGRES_PASSWORD}"
    entrypoint:
      - bash
      - -c
      - /init/01-databases.sh && psql -v ON_ERROR_STOP=1 -U "$$POSTGRES_USER" -f /init/03-app-registry.sql
    volumes:
      - ./db/init:/init:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [hubnet]

  hub:
    build:
      context: .
      dockerfile: hub/Dockerfile
    image: ghcr.io/mitchellpeck/grmc-hub:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks: [hubnet]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hub.rule=Host(`hub.${BASE_DOMAIN}`)"
      - "traefik.http.routers.hub.entrypoints=websecure"
      - "traefik.http.routers.hub.tls.certresolver=le"
      - "traefik.http.routers.hub.tls.domains[0].main=${BASE_DOMAIN}"
      - "traefik.http.routers.hub.tls.domains[0].sans=*.${BASE_DOMAIN}"
      - "traefik.http.services.hub.loadbalancer.server.port=3000"
      - "com.centurylinklabs.watchtower.enable=true"

  whoami:
    build:
      context: .
      dockerfile: apps/whoami/Dockerfile
    image: ghcr.io/mitchellpeck/grmc-whoami:latest
    restart: unless-stopped
    environment:
      WHOAMI_DATABASE_URL: "postgres://${WHOAMI_DB_USER}:${WHOAMI_DB_PASSWORD}@postgres:5432/${WHOAMI_DB_NAME}"
      BASE_DOMAIN: "${BASE_DOMAIN}"
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks: [hubnet]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.${BASE_DOMAIN}`)"
      - "traefik.http.routers.whoami.entrypoints=websecure"
      - "traefik.http.routers.whoami.tls=true"
      - "traefik.http.routers.whoami.middlewares=hub-forward-auth@file"
      - "traefik.http.services.whoami.loadbalancer.server.port=3000"
      - "com.centurylinklabs.watchtower.enable=true"

  social-posts:
    build:
      context: .
      dockerfile: apps/social-posts/Dockerfile
    image: ghcr.io/mitchellpeck/grmc-social-posts:latest
    restart: unless-stopped
    environment:
      SOCIALPOSTS_DB_USER: "${SOCIALPOSTS_DB_USER}"
      SOCIALPOSTS_DB_PASSWORD: "${SOCIALPOSTS_DB_PASSWORD}"
      SOCIALPOSTS_DB_NAME: "${SOCIALPOSTS_DB_NAME}"
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks: [hubnet]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.social.rule=Host(`social.${BASE_DOMAIN}`)"
      - "traefik.http.routers.social.entrypoints=websecure"
      - "traefik.http.routers.social.tls=true"
      - "traefik.http.routers.social.middlewares=hub-forward-auth@file"
      - "traefik.http.services.social.loadbalancer.server.port=3000"
      - "com.centurylinklabs.watchtower.enable=true"

  approvals:
    build:
      context: .
      dockerfile: apps/approvals/Dockerfile
    image: ghcr.io/mitchellpeck/grmc-approvals:latest
    restart: unless-stopped
    environment:
      APPROVALS_DB_USER: "${APPROVALS_DB_USER}"
      APPROVALS_DB_PASSWORD: "${APPROVALS_DB_PASSWORD}"
      APPROVALS_DB_NAME: "${APPROVALS_DB_NAME}"
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks: [hubnet]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.approvals.rule=Host(`approvals.${BASE_DOMAIN}`)"
      - "traefik.http.routers.approvals.entrypoints=websecure"
      - "traefik.http.routers.approvals.tls=true"
      - "traefik.http.routers.approvals.middlewares=hub-forward-auth@file"
      - "traefik.http.services.approvals.loadbalancer.server.port=3000"
      - "com.centurylinklabs.watchtower.enable=true"

  meeting-minutes:
    build:
      context: .
      dockerfile: apps/meeting-minutes/Dockerfile
    image: ghcr.io/mitchellpeck/grmc-meeting-minutes:latest
    restart: unless-stopped
    environment:
      MEETINGMINUTES_DB_USER: "${MEETINGMINUTES_DB_USER}"
      MEETINGMINUTES_DB_PASSWORD: "${MEETINGMINUTES_DB_PASSWORD}"
      MEETINGMINUTES_DB_NAME: "${MEETINGMINUTES_DB_NAME}"
      # Self-hosted transcription (internal, keyless).
      WHISPER_REST_URL: "http://whisper:9000"
      # Optional: WHISPER_TIMEOUT_MS caps how long one transcription may take
      # (default 4h — whisper answers only when the whole job is done, so this
      # must exceed the slowest meeting you record). WHISPER_WARMUP=0 skips the
      # boot-time model load that keeps the first recording of the day fast.
      # WHISPER_CHUNK_SECONDS (default 600) is the part length whole-meeting
      # recordings are split into; the timeout then applies per part. Voices
      # are matched across parts with a speaker-embedding model baked into the
      # image (SPEAKER_EMBEDDING_MODEL overrides its path).
      MINUTES_DATA_DIR: "/data"
    volumes:
      - minutesdata:/data
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks: [hubnet]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minutes.rule=Host(`minutes.${BASE_DOMAIN}`)"
      - "traefik.http.routers.minutes.entrypoints=websecure"
      - "traefik.http.routers.minutes.tls=true"
      - "traefik.http.routers.minutes.middlewares=hub-forward-auth@file"
      - "traefik.http.services.minutes.loadbalancer.server.port=3000"
      - "com.centurylinklabs.watchtower.enable=true"

  # Self-hosted speech-to-text with speaker diarization (faster-whisper).
  # Internal only — no Traefik labels and no published ports, so it is reachable
  # solely from the hubnet by the meeting-minutes app, which POSTs recorded
  # audio to it. No API key and no per-minute cost; audio never leaves the host.
  # First boot downloads the Whisper model + diarization ONNX models into the
  # whisperdata volume.
  whisper:
    image: hwdsl2/whisper-server:latest
    restart: unless-stopped
    environment:
      # English-only weights: faster AND more accurate than multilingual `small`
      # for English audio. NOTE: first boot after changing this downloads a
      # fresh ~465 MB model into the whisperdata volume.
      WHISPER_MODEL: "${WHISPER_MODEL:-small.en}"
      WHISPER_LANGUAGE: "en"
      # The host is an 8-core Apple Silicon Mac. The image defaults to 2
      # threads, which was the single biggest cause of slow transcription.
      # 6 leaves two cores for the rest of the stack.
      WHISPER_THREADS: "${WHISPER_THREADS:-6}"
      # Greedy decoding. Roughly 2-3x faster than the default beam of 5, with
      # negligible accuracy loss on clean English speech.
      WHISPER_BEAM: "${WHISPER_BEAM:-1}"
      # The image's documented recommendation for CPU inference.
      WHISPER_COMPUTE_TYPE: "${WHISPER_COMPUTE_TYPE:-int8}"
      WHISPER_DIARIZATION: "true"      # label who is speaking (SPEAKER_00, 01, …)
      # Clustering threshold: lower = more speakers, higher = fewer. The 0.5
      # default split four people in a room into eight voices.
      WHISPER_DIARIZE_THRESHOLD: "${WHISPER_DIARIZE_THRESHOLD:-0.7}"
      # Empty = auth disabled. With the whisperdata volume mounted the server
      # otherwise auto-generates a Bearer token and rejects unauthenticated
      # calls ("missing authorization header"). Safe here: no published ports,
      # reachable only by the app on the private hubnet.
      WHISPER_API_KEY: ""
    volumes:
      - whisperdata:/var/lib/whisper
    networks: [hubnet]

  expenses:
    build:
      context: .
      dockerfile: apps/expenses/Dockerfile
    image: ghcr.io/mitchellpeck/grmc-expenses:latest
    restart: unless-stopped
    environment:
      EXPENSES_DATABASE_URL: "postgres://${EXPENSES_DB_USER}:${EXPENSES_DB_PASSWORD}@postgres:5432/${EXPENSES_DB_NAME}"
      EXPENSES_DB_USER: "${EXPENSES_DB_USER}"
      EXPENSES_DB_PASSWORD: "${EXPENSES_DB_PASSWORD}"
      EXPENSES_DB_NAME: "${EXPENSES_DB_NAME}"
      BASE_DOMAIN: "${BASE_DOMAIN}"
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks: [hubnet]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.expenses.rule=Host(`expenses.${BASE_DOMAIN}`)"
      - "traefik.http.routers.expenses.entrypoints=websecure"
      - "traefik.http.routers.expenses.tls=true"
      - "traefik.http.routers.expenses.middlewares=hub-forward-auth@file"
      - "traefik.http.services.expenses.loadbalancer.server.port=3000"
      - "com.centurylinklabs.watchtower.enable=true"

  # The narthex announcement screen. Heavier than the other apps on purpose:
  # this image carries LibreOffice, poppler and ffmpeg so a PowerPoint, a PDF
  # and a ProRes clip all turn into something a browser can render, once, at
  # upload time — rather than on the TV, forever.
  narthex-tv:
    build:
      context: .
      dockerfile: apps/narthex-tv/Dockerfile
    image: ghcr.io/mitchellpeck/grmc-narthex-tv:latest
    restart: unless-stopped
    environment:
      NARTHEXTV_DATABASE_URL: "postgres://${NARTHEXTV_DB_USER}:${NARTHEXTV_DB_PASSWORD}@postgres:5432/${NARTHEXTV_DB_NAME}"
      NARTHEXTV_DB_USER: "${NARTHEXTV_DB_USER}"
      NARTHEXTV_DB_PASSWORD: "${NARTHEXTV_DB_PASSWORD}"
      NARTHEXTV_DB_NAME: "${NARTHEXTV_DB_NAME}"
      NARTHEXTV_DATA_DIR: "/data"
      # Graphics already signed off in Approvals can be imported straight onto
      # the screen. Over the internal network with the user's identity
      # forwarded, never by reaching into the approvals database.
      APPROVALS_URL: "http://approvals:3000"
      NARTHEXTV_MAX_FILE_MB: "${NARTHEXTV_MAX_FILE_MB:-512}"
      NARTHEXTV_MAX_FILES: "${NARTHEXTV_MAX_FILES:-20}"
      NARTHEXTV_CONVERT_TIMEOUT_MS: "${NARTHEXTV_CONVERT_TIMEOUT_MS:-1200000}"
      # Only so Screens can show the playout script the right loopback URL.
      NARTHEXTV_LOCAL_PORT: "${NARTHEXTV_LOCAL_PORT:-3010}"
      BASE_DOMAIN: "${BASE_DOMAIN}"
    volumes:
      - narthextvdata:/data
    # The playout script runs on this same machine, so it talks to the app
    # directly rather than going out to Cloudflare and back in through Traefik.
    # That removes the WAN, the TLS handshake and Cloudflare's bot rules from
    # the path between the schedule and the screen: the narthex keeps playing
    # through an internet outage, and nothing blocks a non-browser client.
    # Bound to 127.0.0.1, so this is not reachable from the LAN; the screen
    # token still gates every request exactly as it does through Traefik.
    ports:
      - "127.0.0.1:${NARTHEXTV_LOCAL_PORT:-3010}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks: [hubnet]
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.narthextv.loadbalancer.server.port=3000"
      # The staff-facing app: gated by the hub like every other app.
      - "traefik.http.routers.narthextv.rule=Host(`tv.${BASE_DOMAIN}`)"
      - "traefik.http.routers.narthextv.entrypoints=websecure"
      - "traefik.http.routers.narthextv.tls=true"
      - "traefik.http.routers.narthextv.middlewares=hub-forward-auth@file"
      - "traefik.http.routers.narthextv.service=narthextv"
      # The player surface, on the SAME host but deliberately OUTSIDE
      # forward-auth: a television cannot complete a Google sign-in, and a
      # kiosk browser has nowhere to keep a session. It is gated instead on a
      # per-screen token that the app itself checks on every request (see
      # apps/narthex-tv/src/routes/player.ts). Nothing on these paths reveals
      # anything beyond what that one screen is meant to display.
      - "traefik.http.routers.narthextv-player.rule=Host(`tv.${BASE_DOMAIN}`) && (PathPrefix(`/player`) || PathPrefix(`/player.css`) || PathPrefix(`/player.js`) || PathPrefix(`/api/player`) || PathPrefix(`/assets/fonts`))"
      - "traefik.http.routers.narthextv-player.entrypoints=websecure"
      - "traefik.http.routers.narthextv-player.tls=true"
      - "traefik.http.routers.narthextv-player.priority=100"
      - "traefik.http.routers.narthextv-player.service=narthextv"
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  hubnet:

volumes:
  pgdata:
  letsencrypt:
  whisperdata:
  minutesdata:
  narthextvdata:
